<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NM Auth | Register Client</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #71717a;
      --border: #e4e4e7;
      --input-bg: #ffffff;
      --ring: #18181b;
      --card-bg: #ffffff;
      --card-shadow: 0 10px 25px rgba(0,0,0,0.08);
      --radius: 0.6rem;
      --btn-bg: #18181b;
      --btn-fg: #fafafa;
      --btn-hover: #27272a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #27272a;
        --input-bg: #09090b;
        --ring: #d4d4d8;
        --card-bg: #18181b;
        --card-shadow: 0 10px 25px rgba(0,0,0,0.4);
        --btn-bg: #fafafa;
        --btn-fg: #18181b;
        --btn-hover: #e4e4e7;
      }
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #1e293b, #020617);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      padding: 2rem;
      border: 1px solid var(--border);
    }

    .header {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      height: 2.4rem;
      padding: 0 0.75rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--input-bg);
      font-size: 0.85rem;
      color: var(--fg);
      outline: none;
    }

    input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.08);
    }

    button {
      height: 2.4rem;
      border-radius: var(--radius);
      border: none;
      background: var(--btn-bg);
      color: var(--btn-fg);
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:hover {
      background: var(--btn-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      display: none;
      font-size: 0.8rem;
      color: #ef4444;
      background: rgba(239,68,68,0.1);
      padding: 0.5rem;
      border-radius: var(--radius);
    }

    .result {
      margin-top: 1rem;
      font-size: 0.8rem;
      background: rgba(0,0,0,0.05);
      padding: 0.75rem;
      border-radius: var(--radius);
      word-break: break-all;
    }

    .footer {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .footer a {
      color: var(--fg);
      text-decoration: none;
      font-weight: 500;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="card">
  <div class="header">
    <div class="brand">NM Auth</div>
    <div class="subtitle">Register your application</div>
  </div>

  <form id="form" class="form">
    <div class="error" id="error"></div>

    <div>
      <label>Company Name</label>
      <input type="text" id="companyName" placeholder="Your App Name" required />
    </div>

    <div>
      <label>Redirect URL</label>
      <input type="url" id="redirectUrl" placeholder="https://nm-auth-service-l9vk.vercel.app/callback" required />
    </div>

    <button id="btn">
      <span class="spinner" id="spinner"></span>
      <span id="text">Register Client</span>
    </button>
  </form>

  <div class="result" id="result" style="display:none;"></div>

  <div class="footer">
    Back to <a href="/signin.html">Sign in</a>
  </div>
</div>

<script>
  const form = document.getElementById("form");
  const btn = document.getElementById("btn");
  const spinner = document.getElementById("spinner");
  const text = document.getElementById("text");
  const errorBox = document.getElementById("error");
  const resultBox = document.getElementById("result");

  function setLoading(state) {
    btn.disabled = state;
    spinner.style.display = state ? "block" : "none";
    text.textContent = state ? "Registering..." : "Register Client";
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
  }

  function hideError() {
    errorBox.style.display = "none";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError();

    const companyName = document.getElementById("companyName").value.trim();
    const redirectUrl = document.getElementById("redirectUrl").value.trim();

    if (!companyName || !redirectUrl) {
      showError("Please fill all fields");
      return;
    }

    setLoading(true);

    try {
      const res = await fetch("/clients/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          companyName,
          redirectUrl
        })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.message || "Registration failed");
      }

      resultBox.style.display = "block";
      resultBox.innerHTML = `
        <strong>Client ID:</strong><br>${data.client_id}<br><br>
        <strong>Client Secret:</strong><br>${data.client_secret}
      `;

      form.reset();

    } catch (err) {
      showError(err.message);
    } finally {
      setLoading(false);
    }
  });
</script>

</body>
</html>
