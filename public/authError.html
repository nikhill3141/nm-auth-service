<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unauthorized Client | NM Auth</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #71717a;
      --border: #e4e4e7;
      --card-bg: #ffffff;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --radius: 0.75rem;
      --danger: #ef4444;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #27272a;
        --card-bg: #18181b;
        --shadow: 0 10px 30px rgba(0,0,0,0.4);
      }
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2.2rem;
      text-align: center;
    }

    .logo {
      font-weight: 600;
      font-size: 1.2rem;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.2rem;
      border-radius: 50%;
      background: rgba(239,68,68,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      color: var(--danger);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    button {
      height: 2.4rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .primary {
      background: var(--fg);
      color: var(--bg);
    }

    .primary:hover {
      opacity: 0.85;
    }

    .secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
    }

    .secondary:hover {
      background: rgba(0,0,0,0.05);
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">NM Auth</div>

    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    </div>

    <h1>Unauthorized Client</h1>

    <p>
      This request is missing a valid <strong>client_id</strong> or is not authorized to access NM Auth.
      Please check your application configuration.
    </p>

    <div class="footer">
      NM Auth • Secure Identity Provider
    </div>
  </div>


</body>
</html>
